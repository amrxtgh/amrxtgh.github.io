<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if not .IsHome }}{{ .Title }} | {{ end }}{{ .Site.Title }}</title>
    <link rel="stylesheet" href="/style.css">
    <script>
        (function() {
            var saved = localStorage.getItem('theme');
            if (saved) document.documentElement.className = saved;
        })();
    </script>
</head>
<body>
    <header>
        <button class="theme-toggle" id="themeBtn" onclick="cycleTheme()" aria-label="Cycle theme">
            <span id="themeIcon" style="font-size:1.8em;">&#9788;</span> <span id="themeLabel"></span>
        </button>
        <h1><a href="/" style="text-decoration:none;color:inherit">{{ .Site.Title }}</a></h1>
        <p>learning systems, code, life, and the strange edges between them</p>
        <nav>
            <a href="/about/">[About]</a>
            <a href="/projects/">[Experiments]</a>
            <a href="/external/">[External]</a>
            <a href="/posts/">[Blog]</a>
        </nav>
    </header>
    <main>
        {{ block "main" . }}{{ end }}
    </main>
    <footer>
        <p>&copy; {{ now.Year }} {{ .Site.Title }}</p>
    </footer>
    <script>
        var themes = ['', 'theme-phosphor', 'theme-amber', 'theme-red', 'theme-blue', 'theme-whitehot'];
        var labels = ['CRT::STANDARD', 'NVG::PHOSPHOR', 'P3::AMBER', 'THREAT::RED', 'SONAR::BLUE', 'THERMAL::WHITE'];

        function getThemeIndex() {
            var cls = document.documentElement.className;
            var idx = themes.indexOf(cls);
            return idx === -1 ? 0 : idx;
        }

        function cycleTheme() {
            var idx = getThemeIndex();
            idx = (idx + 1) % themes.length;
            document.documentElement.className = themes[idx];
            localStorage.setItem('theme', themes[idx]);
            updateLabel();
        }

        function updateLabel() {
            var idx = getThemeIndex();
            var el = document.getElementById('themeLabel');
            if (el) el.textContent = labels[idx];
            var themeEl = document.getElementById('currentTheme');
            if (themeEl) themeEl.textContent = labels[idx];
        }

        updateLabel();
    </script>
</body>
</html>
