{{ define "main" }}
<article>
    <div class="post-header">
        <h1>{{ .Title }}</h1>
        <div class="post-date">{{ .Date.Format "Jan 2, 2006" }}</div>
    </div>
    <div class="post-content">
        {{ .Content }}
    </div>
    <a class="back-link" href="/">&larr; Root</a>
</article>
{{ end }}
